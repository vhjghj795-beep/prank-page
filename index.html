
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Monitor</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#08090c;color:#c8d4d8;
  font-family:monospace;min-height:100vh;
  display:flex;justify-content:center;align-items:center;
  padding:18px;transition:background .15s;
}
.panel{width:100%;max-width:650px;border:1px solid #343a40;
  background:#0d1014;padding:20px;box-shadow:0 0 30px #000}
.top{color:#89979f;border-bottom:1px solid #30363d;
  padding-bottom:12px;font-size:12px}
h2{font-size:17px;font-weight:normal;color:#d5dce0}
#status{color:#d4aa55;margin:18px 0}
#log{height:250px;overflow:hidden;font-size:12px;line-height:1.8;
  color:#91a5aa;overflow-wrap:anywhere}
.bar{height:4px;background:#252a30;margin:18px 0}
#progress{height:100%;width:0;background:#c39b4a;transition:width .5s}
button{background:#151a20;color:#d5dce0;border:1px solid #48525c;
  padding:12px 16px;font:inherit;width:100%;cursor:pointer}
#reveal{display:none;text-align:center;padding:30px 5px}
.red{color:#e56c6c}
.small{font-size:11px;color:#718087}
.glitch{animation:shake .18s 3}
@keyframes shake{0%,100%{transform:translateX(0)}
25%{transform:translateX(2px)}75%{transform:translateX(-2px)}}
</style>
</head>
<body>
<main class="panel">
  <div class="top">SYSTEM MONITOR / LOCAL DIAGNOSTICS</div>
  <section id="main">
    <h2>Состояние системы</h2>
    <div id="status">Ожидание запуска проверки...</div>
    <div id="log">Монитор готов.<br>Ожидание команды пользователя.</div>
    <div class="bar"><div id="progress"></div></div>
    <div class="small" id="percent">0% — проверка не запущена</div>
    <br>
    <button id="start">Запустить диагностику</button>
  </section>
  <section id="reveal">
    <h2 class="red">СЦЕНАРИЙ ЗАВЕРШЁН</h2>
    <p>Это был розыгрыш 😈</p>
    <p>Твой телефон не взломан. Страница ничего не проверяла и не собирала.</p>
    <button onclick="location.reload()">Запустить снова</button>
  </section>
</main>
<script>
const messages=[
 [0,"Инициализация локального интерфейса..."],
 [5,"Подготовка диагностических модулей..."],
 [12,"Проверка отображения компонентов..."],
 [19,"Обнаружены нестандартные визуальные события..."],
 [27,"Повторная проверка состояния интерфейса..."],
 [35,"Ответ получен. Выполняется перепроверка..."],
 [43,"Временная ошибка отображения. Продолжение..."],
 [51,"Повторная инициализация визуальных компонентов..."],
 [60,"Некоторые сообщения могут отображаться с задержкой..."],
 [68,"Выполняется восстановление интерфейса..."],
 [77,"Синхронизация индикаторов..."],
 [87,"Завершающая проверка анимации..."],
 [96,"Подготовка финального экрана..."]
];
const start=document.getElementById('start');
const status=document.getElementById('status');
const log=document.getElementById('log');
const progress=document.getElementById('progress');
const percent=document.getElementById('percent');
let running=false;
start.onclick=()=>{
 if(running)return;
 running=true;start.disabled=true;
 start.textContent="Диагностика выполняется...";
 const begin=Date.now(),duration=90000;
 let last=-1;
 function tick(){
  const elapsed=Date.now()-begin;
  const p=Math.min(100,Math.floor(elapsed/duration*100));
  progress.style.width=p+"%";
  percent.textContent=p+"% — демонстрационная анимация";
  let idx=0;
  messages.forEach((m,i)=>{if(p>=m[0])idx=i});
  if(idx!==last){
   last=idx;
   status.textContent=messages[idx][1];
   const line="["+new Date().toLocaleTimeString()+"] "+messages[idx][1];
   log.innerHTML+= "<br>"+line.replace(/</g,"&lt;").replace(/>/g,"&gt;");
   log.scrollTop=log.scrollHeight;
  }
  if(p>=100){
   status.textContent="Демонстрация завершена.";
   document.getElementById('main').style.display="none";
   document.getElementById('reveal').style.display="block";
   return;
  }
  if(p===43||p===68){
   document.querySelector('.panel').classList.add('glitch');
   setTimeout(()=>document.querySelector('.panel').classList.remove('glitch'),600);
  }
  setTimeout(tick,700);
 }
 tick();
};
</script>
</body>
</html>
